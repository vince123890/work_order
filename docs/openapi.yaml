components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Supabase Auth. Claim aplikasi ada di app_metadata (roles, customer_id, customer_role, technician_id).
    cronAuth:
      type: http
      scheme: bearer
      description: Rahasia pekerjaan terjadwal (CRON_SECRET), hanya di server.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Vasta-Signature
      description: Format t=<unix>,v1=<hex HMAC-SHA256 atas "t.body">. Toleransi waktu [P].
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID v7 unik per niat aksi; diteruskan sebagai p_op_id ke RPC (uq_wsh_op). Pengulangan mengembalikan hasil
        lama dengan replayed=true.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: 'Versi entitas, contoh "7"; diteruskan sebagai p_expected_version. Tidak cocok: 409 VERSION_CONFLICT (WO004).
        Tidak ada: 428.'
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Opsional untuk aksi teknisi; konflik dinilai per kategori kepemilikan data (02 bagian 6.3).
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor opaque dari next_cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Default dan maksimum adalah [P] (belum ditetapkan).
  responses:
    BadRequest:
      description: Permintaan tidak dapat diurai atau header wajib hilang.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Tidak terautentikasi (UNAUTHENTICATED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Peran tidak diizinkan (FORBIDDEN_ROLE) atau akun nonaktif (ACCOUNT_INACTIVE).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Tidak ditemukan atau di luar cakupan pemanggil (NOT_FOUND, seragam).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Konflik status/versi/idempotensi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Payload terlalu besar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Tipe media tidak didukung.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validasi gagal atau aturan bisnis tidak terpenuhi.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpgradeRequired:
      description: Versi aplikasi klien terlalu lama (APP_UPDATE_REQUIRED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match wajib.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Batas laju terlampaui.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Detik sampai boleh mencoba lagi.
          schema:
            type: integer
        RateLimit-Limit:
          description: Kuota jendela saat ini ([P], tidak ditetapkan di dokumen).
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          description: Detik sampai jendela reset.
          schema:
            type: integer
    ServiceUnavailable:
      description: Layanan pendukung tidak tersedia; aman diulang.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemDefault:
      description: Galat lain (application/problem+json).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC, contoh 2026-11-02T08:15:30Z.
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^-?\d+(\.\d{1,2})?$
          description: Desimal sebagai string (kolom numeric(14,2) di 04).
        currency:
          type: string
          default: IDR
          description: '[A] Mata uang implisit tunggal (D24).'
    AppRole:
      type: string
      description: Enum app_role di 04.
      enum:
      - CUSTOMER
      - ADMIN_CS
      - DISPATCHER
      - TECHNICIAN
      - SUPERVISOR
      - WAREHOUSE
      - FINANCE
      - OWNER
    RequestStatus:
      type: string
      enum:
      - SUBMITTED
      - NEEDS_INFO
      - REJECTED
      - CONVERTED
      - CANCELLED_BY_CUSTOMER
    WoStatus:
      type: string
      enum:
      - NEW
      - ASSIGNED
      - ACCEPTED
      - EN_ROUTE
      - IN_PROGRESS
      - ON_HOLD_PARTS
      - AWAITING_CUSTOMER_APPROVAL
      - AWAITING_SIGNOFF
      - UNDER_REVIEW
      - RETURNED
      - CLOSED
      - CANCELLED
    DisplayStatus:
      type: string
      description: 'Hasil app.customer_status(); dihitung di database (4.2 di 02). Untuk permintaan non-WO: RECEIVED, UNPROCESSABLE,
        CANCELLED.'
      enum:
      - RECEIVED
      - SCHEDULED
      - EN_ROUTE
      - IN_PROGRESS
      - AWAITING_CUSTOMER
      - COMPLETED
      - CANCELLED
      - UNPROCESSABLE
    WoOutcome:
      type: string
      enum:
      - RESOLVED
      - PARTIAL
      - UNRESOLVED
    BillingType:
      type: string
      enum:
      - BILLABLE
      - WARRANTY
      - COVERED_CONTRACT
      - WARRANTY_WORK
    ApprovalStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - EXPIRED
      - SUPERSEDED
    DecisionChannel:
      type: string
      enum:
      - PWA
      - PHONE
      - CHAT
      - OTHER
    ProblemFieldError:
      type: object
      required:
      - pointer
      - code
      properties:
        pointer:
          type: string
          description: JSON Pointer ke field bermasalah.
        code:
          type: string
        detail:
          type: string
    ClosureUnmet:
      type: object
      required:
      - code
