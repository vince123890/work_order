openapi: 3.1.0
info:
  title: 'VASTA Field Service API (Jalur B: Route Handler / RPC)'
  version: 0.1.0-draft
  summary: Kontrak endpoint logika kritis. Pembacaan dan CRUD sederhana lewat Supabase PostgREST+RLS tidak tercakup (lihat
    03_api_design.md bagian 2).
  description: |-
    Draf kontrak yang konsisten dengan `03_api_design.md`. Semua angka operasional (batas laju, ukuran, kedaluwarsa, ukuran halaman) adalah parameter [P] dan sengaja tidak ditetapkan. Nama tabel/kolom/enum/RPC mengikuti `04_database_schema.sql` dan `05_rls_and_security.md` (acuan); celah yang belum ada di 04 ditandai G-nn di 03 bagian 10.2.

    Cakupan: endpoint Lapis produk 1 dan 2 lengkap; Lapis 3 ringkas. Setiap operasi memuat ekstensi `x-roles`, `x-layer`, `x-transition`, `x-error-codes`.

    Peran memakai enum app_role: CUSTOMER, ADMIN_CS, DISPATCHER, TECHNICIAN, SUPERVISOR, WAREHOUSE, FINANCE, OWNER; ditambah ANY (pengguna terautentikasi), PUBLIC, SYSTEM (job/webhook).
  license:
    name: Proprietary (portofolio)
    identifier: LicenseRef-Portfolio
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: localhost:3000
      description: '[A] Host aplikasi Next.js.'
tags:
- name: akun
  description: Akun, registrasi, undangan
- name: permintaan
  description: Permintaan servis dan unggahan
- name: wo-transisi
  description: 'Work order: transisi status (wo_transition) dan RPC kecil'
- name: persetujuan
  description: Persetujuan biaya tambahan
- name: stok
  description: Suku cadang dan stok
- name: kontrak-pm
  description: Pemeliharaan berkala
- name: berkas
  description: Berkas
- name: sinkron
  description: Sinkronisasi offline teknisi
- name: internal
  description: Endpoint internal (job, webhook)
- name: lapis3
  description: Lapis 3 (ringkas)
security:
- bearerAuth: []
paths:
  /auth/registrations:
    post:
      operationId: registerCustomer
      summary: 'Mulai registrasi mandiri: captcha + OTP email'
      tags:
      - akun
      description: |-
        Selalu 202 agar keberadaan akun dan konfigurasi tidak bocor. Bila `registration.mode` NULL atau INVITE, tidak ada efek. Sesudah verifikasi OTP klien memanggil `POST /me/registration`. Hanya pelanggan perorangan (`register_individual_customer`); pelanggan korporat lewat undangan.

        Peran (enum app_role): PUBLIC. Lapis produk: 1.

        Backing database: Supabase Auth signInWithOtp (server).

        Kode error domain: `CAPTCHA_FAILED` (422); `RATE_LIMITED` (429); `VALIDATION_FAILED` (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security: []
      x-roles:
      - PUBLIC
      x-db: Supabase Auth signInWithOtp (server)
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - CAPTCHA_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      x-rate-limit-policy: registration
  /me/registration:
    post:
      operationId: completeRegistration
      summary: Selesaikan registrasi pelanggan perorangan (customer + consent)
      tags:
      - akun
      description: |-
        Peran (enum app_role): ANY. Lapis produk: 1.

        Backing database: rpc register_individual_customer(p_full_name, p_phone, p_policy_version).

        Kode error domain: `REGISTRATION_DISABLED` (403); `VALIDATION_FAILED` (422); `INVALID_TRANSITION` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRegistrationRequest'
      responses:
        '201':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ANY
      x-db: rpc register_individual_customer(p_full_name, p_phone, p_policy_version)
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - REGISTRATION_DISABLED
      - VALIDATION_FAILED
      - INVALID_TRANSITION
  /me/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Terima undangan pelanggan (token sekali pakai)
      tags:
      - akun
      description: |-
        Peran (enum app_role): ANY. Lapis produk: 1.

        Backing database: rpc accept_customer_invitation(p_token, p_policy_version).

        Kode error domain: `INVITATION_INVALID` (404); `VALIDATION_FAILED` (422); `INVALID_TRANSITION` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ANY
      x-db: rpc accept_customer_invitation(p_token, p_policy_version)
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - INVITATION_INVALID
      - VALIDATION_FAILED
      - INVALID_TRANSITION
  /me:
    get:
      operationId: getMe
      summary: Profil, peran, keanggotaan pelanggan, dan technician_id pemanggil
      tags:
      - akun
      description: |-
        Hanya petunjuk UI. Otorisasi tidak pernah memakai respons ini (D01).

        Peran (enum app_role): ANY. Lapis produk: 1.

        Backing database: select profiles, user_roles, customer_users, technicians (JWT).
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ANY
      x-db: select profiles, user_roles, customer_users, technicians (JWT)
      x-layer: 1
      x-jalur: B
  /customers/{customerId}/invitations:
    post:
      operationId: inviteCustomerUser
      summary: Buat undangan pelanggan dan kirim email
      tags:
      - akun
      description: |-
        Server membuat token acak, menyimpan hanya `token_hash`, mengirim tautan. Token tidak disimpan dan tidak dikembalikan.

        Peran (enum app_role): ADMIN_CS. Lapis produk: 1.

        Backing database: insert customer_invitations (token_hash) dengan JWT ADM + kirim email (server).

        Kode error domain: `VALIDATION_FAILED` (422); `NOT_FOUND` (404).
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN_CS
      x-db: insert customer_invitations (token_hash) dengan JWT ADM + kirim email (server)
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - VALIDATION_FAILED
      - NOT_FOUND
  /admin/staff-users:
    post:
      operationId: createStaffUser
      summary: Buat pengguna staf lalu tetapkan peran
      tags:
      - akun
      description: |-
        Mengubah peran OWNER/ADMIN_CS hanya oleh OWNER (D22). CUSTOMER eksklusif terhadap peran staf. Baris `technicians` dibuat lewat Jalur A (ADM) bila perlu.

        Peran (enum app_role): ADMIN_CS, OWNER. Lapis produk: 1.

        Backing database: auth.admin.inviteUserByEmail (service role) + rpc admin_set_user_roles.

        Kode error domain: `EMAIL_ALREADY_REGISTERED` (409); `FORBIDDEN_ROLE` (403); `VALIDATION_FAILED` (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreate'
      responses:
        '201':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN_CS
      - OWNER
      x-db: auth.admin.inviteUserByEmail (service role) + rpc admin_set_user_roles
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - EMAIL_ALREADY_REGISTERED
      - FORBIDDEN_ROLE
      - VALIDATION_FAILED
  /admin/staff-users/{userId}:
    patch:
      operationId: updateStaffUser
      summary: Ubah peran dan/atau status aktif; sesi dicabut saat dinonaktifkan
      tags:
      - akun
      description: |-
        RLS menolak pengguna nonaktif seketika; signOut hanya mempercepat pembersihan token (FR-007).

        Peran (enum app_role): ADMIN_CS, OWNER. Lapis produk: 1.

        Backing database: rpc admin_set_user_roles / admin_set_user_active + auth.admin.signOut (service role).

        Kode error domain: `FORBIDDEN_ROLE` (403); `VALIDATION_FAILED` (422).
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserPatch'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN_CS
      - OWNER
      x-db: rpc admin_set_user_roles / admin_set_user_active + auth.admin.signOut (service role)
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - FORBIDDEN_ROLE
      - VALIDATION_FAILED
  /uploads/sign:
    post:
      operationId: signUpload
      summary: Minta signed upload URL untuk baris metadata yang sudah dibuat klien
      tags:
      - permintaan
      description: |-
        Urutan: (1) klien INSERT baris `request_attachments` / `wo_attachments` / `wo_signatures` lewat Jalur A (path `{customer_id}/req/{request_id}/...` atau `{customer_id}/wo/{wo_id}/...`, upload_status PENDING); (2) endpoint ini; (3) klien PUT ke URL; (4) `POST /uploads/complete`. Tidak ada policy INSERT di storage.objects (D19). Foto/tanda tangan teknisi: WO harus editable (`app.can_edit_wo`). Tanda tangan pelanggan via PWA: `resource=WO_SIGNATURE_PWA` dengan `wo_id` + `file_name` (tanpa metadata; baris dibuat `wo_customer_sign`).

        Peran (enum app_role): CUSTOMER, ADMIN_CS, TECHNICIAN. Lapis produk: 1.

        Backing database: baca baris metadata (JWT, RLS membuktikan hak) lalu createSignedUploadUrl (service role, 05 bagian 6a).

        Kode error domain: `UPLOAD_TYPE_NOT_ALLOWED` (415); `UPLOAD_TOO_LARGE` (413); `UPLOAD_LIMIT_EXCEEDED` (422); `UPLOAD_PATH_INVALID` (422); `DATA_IMMUTABLE` (409); `RATE_LIMITED` (429); `NOT_FOUND` (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUploadRequest'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTarget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      - ADMIN_CS
      - TECHNICIAN
      x-db: baca baris metadata (JWT, RLS membuktikan hak) lalu createSignedUploadUrl (service role, 05 bagian 6a)
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - UPLOAD_TYPE_NOT_ALLOWED
      - UPLOAD_TOO_LARGE
      - UPLOAD_LIMIT_EXCEEDED
      - UPLOAD_PATH_INVALID
      - DATA_IMMUTABLE
      - RATE_LIMITED
      - NOT_FOUND
      x-rate-limit-policy: upload
  /uploads/complete:
    post:
      operationId: completeUpload
      summary: 'Konfirmasi unggahan: server memverifikasi lalu menandai UPLOADED'
      tags:
      - permintaan
      description: |-
        Hanya server yang dapat mengubah `upload_status` (hak kolom dicabut dari klien, D19). Idempoten alami. `wo_signatures` tidak punya kolom upload_status (G-04).

        Peran (enum app_role): CUSTOMER, ADMIN_CS, TECHNICIAN. Lapis produk: 1.

        Backing database: service role: cek objek (ukuran, magic bytes, sha256) lalu update upload_status=UPLOADED.

        Kode error domain: `UPLOAD_NOT_FOUND` (409); `CHECKSUM_MISMATCH` (422); `UPLOAD_TYPE_NOT_ALLOWED` (415); `NOT_FOUND` (404).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      - ADMIN_CS
      - TECHNICIAN
      x-db: 'service role: cek objek (ukuran, magic bytes, sha256) lalu update upload_status=UPLOADED'
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - UPLOAD_NOT_FOUND
      - CHECKSUM_MISMATCH
      - UPLOAD_TYPE_NOT_ALLOWED
      - NOT_FOUND
  /service-requests/{requestId}/approve:
    post:
      operationId: approveServiceRequest
      summary: Setujui permintaan dan buat WO (T-01)
      tags:
      - permintaan
      description: |-
        Satu transaksi: nomor WO `WO-YYYY-nnnnnn` (document_counters), billing_type (app.determine_billing), snapshot SLA, riwayat, audit, notifikasi `request.accepted`. Auto-approve kontrak (SP-02) berjalan sebagai SYSTEM_RULE di trigger, tanpa endpoint.

        Peran (enum app_role): ADMIN_CS. Lapis produk: 1.

        Backing database: rpc request_decide(p_request_id, 'APPROVE', p_priority_code, p_service_type_id, p_estimate_total, p_reason, p_expected_version).

        Transisi/aturan: T-01 (dokumen 02 bagian 4.4).

        Kode error domain: `ASSET_REQUIRED` (422); `SERVICE_TYPE_REQUIRED` (422); `PRIORITY_REQUIRED` (422); `INVALID_TRANSITION` (409); `VERSION_CONFLICT` (409); `NOT_FOUND` (404); `FORBIDDEN_ROLE` (403).
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequestBody'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveRequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN_CS
      x-db: rpc request_decide(p_request_id, 'APPROVE', p_priority_code, p_service_type_id, p_estimate_total, p_reason, p_expected_version)
      x-layer: 1
      x-jalur: B
      x-transition: T-01
      x-error-codes:
      - ASSET_REQUIRED
      - SERVICE_TYPE_REQUIRED
      - PRIORITY_REQUIRED
      - INVALID_TRANSITION
      - VERSION_CONFLICT
      - NOT_FOUND
      - FORBIDDEN_ROLE
  /service-requests/{requestId}/request-info:
    post:
      operationId: requestMoreInfo
      summary: Minta info tambahan ke pelanggan (NEEDS_INFO)
      tags:
      - permintaan
      description: |-
        Peran (enum app_role): ADMIN_CS. Lapis produk: 1.

        Backing database: rpc request_decide(..., 'NEEDS_INFO', p_reason := catatan).

        Kode error domain: `REASON_REQUIRED` (422); `INVALID_TRANSITION` (409); `VERSION_CONFLICT` (409); `NOT_FOUND` (404).
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonOnly'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN_CS
      x-db: rpc request_decide(..., 'NEEDS_INFO', p_reason := catatan)
      x-layer: 1
      x-jalur: B
      x-error-codes:
      - REASON_REQUIRED
      - INVALID_TRANSITION
      - VERSION_CONFLICT
      - NOT_FOUND
  /service-requests/{requestId}/reject:
    post:
      operationId: rejectServiceRequest
      summary: Tolak permintaan dengan alasan (T-24)
      tags:
      - permintaan
      description: |-
        Peran (enum app_role): ADMIN_CS. Lapis produk: 1.

        Backing database: rpc request_decide(..., 'REJECT', p_reason).

        Transisi/aturan: T-24 (dokumen 02 bagian 4.4).

        Kode error domain: `REASON_REQUIRED` (422); `INVALID_TRANSITION` (409); `VERSION_CONFLICT` (409); `NOT_FOUND` (404).
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonOnly'
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/ProblemDefault'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN_CS
      x-db: rpc request_decide(..., 'REJECT', p_reason)
      x-layer: 1
      x-jalur: B
      x-transition: T-24
      x-error-codes:
      - REASON_REQUIRED
      - INVALID_TRANSITION
      - VERSION_CONFLICT
      - NOT_FOUND
  /work-orders/{workOrderId}/assign:
    post:
      operationId: assignWorkOrder
      summary: Tugaskan teknisi + jadwal final
      tags:
      - wo-transisi
      description: |-
        Peran (enum app_role): DISPATCHER. Lapis produk: 1.

        Backing database: wo_transition('ASSIGN'; p_payload {technician_id, scheduled_start, scheduled_end, override_reason}).

        Transisi/aturan: T-02 (dokumen 02 bagian 4.4).

        Kode error domain: `TECHNICIAN_INVALID` (422); `SCHEDULE_REQUIRED` (422); `SOFT_GUARD` (422); `INVALID_TRANSITION` (409); `VERSION_CONFLICT` (409); `FORBIDDEN_ROLE` (403); `NOT_FOUND` (404).
      parameters:
      - name: workOrderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
