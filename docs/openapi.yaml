    SyncOpResult:
      type: object
      required:
      - op_id
      - status
      properties:
        op_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ACKED
          - REJECTED
          - RETRY
          - HELD
          description: ACKED (termasuk replay), REJECTED (permanen), RETRY (galat sementara), HELD (celah seq).
        code:
          type:
          - string
          - 'null'
        detail:
          type:
          - string
          - 'null'
        replayed:
          type: boolean
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
        expected_seq:
          type:
          - integer
          - 'null'
        db_status:
          type: string
          enum:
          - RECEIVED
          - APPLIED
          - REJECTED
          - RESCUED
          description: Nilai sync_operations.status (enum sync_op_status).
        clock_skew:
          type: boolean
        retry_after_seconds:
          type:
          - integer
          - 'null'
    SyncPushResponse:
      type: object
      required:
      - server_time
      - results
      properties:
        server_time:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncOpResult'
    SyncChange:
      type: object
      required:
      - entity
      - id
      properties:
        entity:
          type: string
          enum:
          - WORK_ORDER
          - CHECKLIST_ITEMS
          - FINDINGS
          - ATTACHMENTS
          - SIGNATURES
          - LABOR_LINES
          - PART_USAGES
          - EXTRA_COST_APPROVAL
          - PART_REQUEST
          - ASSET_HISTORY
          - STOCK_BALANCE
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
        data:
          type: object
          additionalProperties: true
          description: Dibaca dari view tech_* atau tabel yang diizinkan RLS; tanpa harga (AP-2).
    SyncPullResponse:
      type: object
      required:
      - server_time
      - snapshot
      - changes
      - active_wo_ids
      - next_cursor
      - has_more
      properties:
        server_time:
          $ref: '#/components/schemas/Timestamp'
        snapshot:
          type: boolean
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        active_wo_ids:
          type: array
          description: Himpunan lengkap app.my_active_wo_ids() saat ini. WO yang ada di cache tetapi tidak di sini harus dibersihkan
            (setelah outbox WO itu kosong atau jadi draf diselamatkan). Menggantikan tombstone REMOVE karena 04 tidak punya
            umpan perubahan (G-05).
          items:
            $ref: '#/components/schemas/Id'
        next_cursor:
          type: string
        has_more:
          type: boolean
    JobRunResult:
      type: object
      required:
      - job
      - processed
      properties:
        job:
          type: string
        processed:
          type: integer
        job_run_id:
          type: integer
    ProviderWebhookEvent:
      type: object
      required:
      - event_id
      additionalProperties: true
      properties:
        event_id:
          type: string
          description: Dipakai untuk deduplikasi.
    InvoiceCreate:
      type: object
      required:
      - wo_ids
      properties:
        wo_ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Id'
    Invoice:
      type: object
      required:
      - id
      - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        invoice_no:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - DRAFT
          - ISSUED
          - PAID
          - VOID
    PaymentBody:
      type: object
      required:
      - amount
      - paid_at
      - method
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        paid_at:
          $ref: '#/components/schemas/Timestamp'
        method:
          type: string
        reference:
          type: string
    InvoiceExportBody:
      type: object
      required:
      - format
      properties:
        format:
          type: string
          description: 'TODO: format ditetapkan setelah D12/OQ-22.'
        invoice_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
    InvoiceExport:
      type: object
      required:
      - id
      - download_url
      properties:
        id:
          $ref: '#/components/schemas/Id'
        download_url:
          type: string
          format: uri
    ImportBody:
      type: object
      required:
      - type
      - file_path
      properties:
        type:
          type: string
          enum:
          - CUSTOMERS
          - ASSETS
          - STOCK
        file_path:
          type: string
    ImportJob:
      type: object
      required:
      - id
      - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - UPLOADED
          - VALIDATED
          - COMMITTED
          - FAILED
        error_report:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: true
