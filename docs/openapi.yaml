        ADD_SIGNATURE: '{signature_id, signer_name, storage_path, device_meta}'
        ADD_LABOR_LINE: '{line_id, service_item_id, description, qty, is_extra, extra_approval_id, emergency, emergency_reason}'
        REMOVE_LABOR_LINE: '{line_id}'
        ADD_PART_USAGE: '{usage_id, item_id, qty, is_extra, extra_approval_id, emergency, emergency_reason, source_location_id}'
        REMOVE_PART_USAGE: '{usage_id}'
        CREATE_PART_REQUEST: '{lines[], note}'
        CREATE_PART_RETURN: '{lines[], note}'
